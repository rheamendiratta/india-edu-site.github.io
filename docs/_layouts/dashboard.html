<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/dashboard.css' | relative_url }}">
</head>

<body>

  <!-- SITE HEADER -->
  <header class="site-header">
    <span class="site-header-title">{{ site.title }}</span>
  </header>

  <!-- TOP NAV: World / India / States -->
  {% include top-nav.html %}

  <!-- TAB NAV: Map / Students / Teachers etc -->
  {% include tab-nav.html %}

  <!-- PAGE CONTENT (Shiny iframe goes here) -->
  <main class="content">
  {% if page.shiny_url %}
    <iframe 
      class="shiny-embed"
      id="shiny-frame"
      src="{{ page.shiny_url }}{% if page.level == 'states' %}?state={{ page.state }}{% endif %}"
      allowfullscreen>
    </iframe>
  {% else %}
    {{ content }}
  {% endif %}
</main>

</body>
</html>
